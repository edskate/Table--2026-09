<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>03</title>
    <style>
        sup {
            font-size: smaller;
            margin-left: 2px;
            vertical-align: super;
        }
        i {
            font-style: italic;
            color: Blue;
            text-decoration: underline;
            text-shadow: 1px 1px 2px gray;
            font-size: larger;
            margin: 20px;
        }
        div {
            margin: 10px;
            border: 1px solid black;
            border-radius: 27.5px;
            width: 200px;
            text-align: center;
            box-shadow: inset 2px 2px 5px rgba(211, 0, 0, 0.1);
            transition: all 0.3s ease;
        }
     
    </style>
</head>
<body>
    <h2>HEADING 2</h2>
<div>This is a container for the content below.</div>
<div>
    <p>This is<sup> a <i>cat</i></sup></p>
    <p>This is<sup> a <i>dog</i></sup></p>
    <p>This is<sup> a <i>bird</i></sup></p>
    <p>This is<sup> a <i>fish</i></sup></p>
    <p>This is<sup> a <i>rabbit</i></sup></p>
    <p>This is<sup> a <i>turtle</i></sup></p>
</div>
<hr>

</body>
</html>
